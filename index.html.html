<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تكويد الأعضاء - جامعة أسوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>نظام تكويد الأعضاء</h1>
        
        <label for="name">الاسم:</label>
        <input type="text" id="name" placeholder="أدخل اسمك">
        
        <label for="gender">النوع:</label>
        <select id="gender">
            <option value="1">ذكر</option>
            <option value="2">أنثى</option>
        </select>

        <label for="college">الكليـة:</label>
        <select id="college">
            <option value="1">كلية الآثار</option>
            <option value="2">كلية الآداب</option>
            <option value="3">كلية الألسن</option>
            <option value="4">كلية التربية</option>
            <option value="5">كلية التربية النوعية</option>
            <option value="6">كلية التجارة</option>
            <option value="7">كلية التمريض</option>
            <option value="8">كلية الحقوق</option>
            <option value="9">كلية الخدمة الاجتماعية</option>
            <option value="10">كلية الزراعة والموارد الطبيعية</option>
            <option value="11">كلية الطب</option>
            <option value="12">كلية الطب البيطري</option>
            <option value="13">كلية العلوم</option>
            <option value="14">كلية علوم الرياضة</option>
            <option value="15">كلية تكنولوجيا المصايد والأسماك</option>
            <option value="16">كلية دار العلوم</option>
            <option value="17">كلية الهندسة</option>
            <option value="18">كلية هندسة الطاقة</option>
            <option value="19">معهد التمريض</option>
        </select>
        
        <label for="birthYear">سنة الميلاد:</label>
        <input type="text" id="birthYear" maxlength="4" placeholder="أدخل سنة الميلاد" oninput="validateBirthYear(this)">
        
        <label for="regNumber">رقم التسجيل بالكلية:</label>
        <input type="text" id="regNumber" placeholder="أدخل رقم التسجيل">
        
        <button onclick="generateMembership()">استخراج كود العضوية</button>
        
        <div class="output" id="output">
            <p id="membershipCode" class="bold-text"></p>
            <div class="qr-code" id="qrCode"></div>
            <button onclick="copyCode()" id="copyButton">نسخ الكود</button>
        </div>
    </div>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
